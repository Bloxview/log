<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Simple Login System | Supabase Auth</title>
  <!-- Supabase JS library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & minimal styling -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #e9f0fc 0%, #f1f5fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 460px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(0px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .card-header {
      background: #ffffff;
      padding: 1.8rem 2rem 0.8rem 2rem;
      text-align: center;
      border-bottom: 1px solid #eef2f9;
    }

    .card-header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      background: linear-gradient(135deg, #1E2A5E, #2C3E77);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .card-header p {
      color: #5b6e8c;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .form-container {
      padding: 2rem 2rem 1.8rem 2rem;
    }

    .input-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      color: #1f2a44;
      margin-bottom: 0.4rem;
      letter-spacing: -0.2px;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 1.2rem;
      background: #ffffff;
      transition: 0.2s;
      font-family: inherit;
      outline: none;
      color: #0a1c2f;
    }

    input:focus {
      border-color: #3b6eff;
      box-shadow: 0 0 0 3px rgba(59, 110, 255, 0.2);
    }

    .btn {
      width: 100%;
      background: #1e2f5e;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      margin-top: 0.6rem;
      background: linear-gradient(100deg, #1e2f5e, #2a3f70);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .btn:hover {
      background: linear-gradient(100deg, #16264b, #1f3360);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .btn-secondary {
      background: #f0f4fe;
      color: #1e2f5e;
      box-shadow: none;
      margin-top: 0.8rem;
      border: 1px solid #cddef7;
    }

    .btn-secondary:hover {
      background: #e6edfc;
      transform: translateY(-1px);
    }

    .message-area {
      margin-top: 1.2rem;
      padding: 0.7rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      text-align: center;
      background: #f8fafd;
      color: #2c3e66;
      transition: 0.2s;
      border: 1px solid #eef2fc;
    }

    .error-msg {
      color: #c2412c;
      background: #fff4f2;
      border-color: #ffdad6;
    }

    .success-msg {
      color: #146b3a;
      background: #e3f9ef;
      border-color: #b8e6cf;
    }

    .user-info {
      background: #f5f9ff;
      padding: 1.4rem;
      border-radius: 1.2rem;
      margin: 0 0 1.5rem 0;
      text-align: center;
      border: 1px solid #e2edff;
    }

    .avatar-placeholder {
      background: #eef3ff;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      font-size: 1.8rem;
      font-weight: 500;
      color: #1e2f5e;
    }

    .logout-btn {
      background: #ffffff;
      border: 1px solid #cfddee;
      color: #4a5c7c;
      font-weight: 500;
      margin-top: 0.6rem;
      box-shadow: none;
    }

    .logout-btn:hover {
      background: #f1f4fc;
      border-color: #b9cbeb;
    }

    hr {
      margin: 1rem 0;
      border: none;
      border-top: 1px solid #e7edf8;
    }

    .flex-btns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .flex-btns .btn {
      flex: 1;
      margin-top: 0;
    }

    .small-note {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 1rem;
      color: #7e8ea8;
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 1.6rem;
      }
      .card-header h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div class="card" id="appRoot">
  <div class="card-header">
    <h1>🔐 access portal</h1>
    <p>sign in or create account • supabase auth</p>
  </div>
  <div class="form-container" id="dynamicContent">
    <!-- dynamic content will be injected by JS -->
    <div style="text-align: center; padding: 2rem;">Loading secure gateway...</div>
  </div>
</div>

<script>
  // --------------------------------------------------------------
  // YOUR SUPABASE PUBLIC API KEY (ANON KEY)
  // Provided by user: sb_publishable_KhfoHF3GW_8Wuycg8N8pEA_08sxglIn
  // Note: For Supabase, the anon key is often prefixed with 'sb_publishable_'
  // but the actual supabase URL is required. Since only the publishable key
  // is given, we need to extract or assume the Supabase project URL.
  // However, a valid Supabase client needs both URL and anon key.
  // The provided key looks like a Supabase publishable/anonym key,
  // but the project URL is missing. For demo purposes I'll create a
  // placeholder detection: many Supabase projects follow pattern:
  // https://xxxxx.supabase.co . Without URL the auth cannot work.
  // To make the system functional and illustrative, I'll allow user
  // to enter their Supabase URL in a friendly modal OR auto-detect?
  // Since requirement: "this is my api key for my super base sb_publishable_..."
  // I'll provide a **working interactive login** that uses localStorage demo
  // if URL missing? but that would be fake. Better to build fully functional
  // Supabase auth IF user provides URL. For clarity: I will create a smart helper:
  // We ask user to provide their Supabase project URL (because it's required)
  // but also respect the provided key. This ensures real authentication.
  // For simplicity & demonstration, I'll prefill with an input for URL
  // OR use a known test? No — we must build real supabase auth with actual credentials.
  // The key is given, but the URL is missing. I'll implement a configuration step:
  // a small config panel that stores URL into localStorage. First time user sets it.
  // After setting, login works with real Supabase. This is honest and robust.
  // --------------------------------------------------------------
  
  // The user's Supabase anon key (publishable key)
  const USER_PROVIDED_ANON_KEY = "sb_publishable_KhfoHF3GW_8Wuycg8N8pEA_08sxglIn";
  
  // Storage keys
  const STORAGE_SUPABASE_URL = "supabase_custom_url";
  const STORAGE_SESSION_KEY = "supabase_auth_session";
  
  let supabaseClient = null;
  let currentSession = null;       // store session object
  
  // DOM elements container
  const dynamicContainer = document.getElementById("dynamicContent");
  
  // Helper: render configuration UI (first time or missing URL)
  function renderConfigUI() {
    dynamicContainer.innerHTML = `
      <div style="margin-bottom: 0.5rem;">
        <div class="input-group">
          <label>🔌 Supabase Project URL</label>
          <input type="text" id="supabaseUrlInput" placeholder="https://yourproject.supabase.co" value="">
          <div class="small-note" style="margin-top: 8px; text-align:left;">Example: https://xyzcompany.supabase.co</div>
        </div>
        <div class="input-group">
          <label>📌 Anon Key (pre-filled)</label>
          <input type="text" id="anonKeyInput" value="${USER_PROVIDED_ANON_KEY}" readonly disabled style="background:#f3f6fc; color:#2c3e66;">
          <div class="small-note">Your publishable key is already set.</div>
        </div>
        <button class="btn" id="saveConfigBtn">🔗 Connect to Supabase</button>
        <div class="message-area" id="configMessage"></div>
      </div>
    `;
    const saveBtn = document.getElementById("saveConfigBtn");
    const urlInput = document.getElementById("supabaseUrlInput");
    const configMsg = document.getElementById("configMessage");
    
    // try to load previously saved URL
    const savedUrl = localStorage.getItem(STORAGE_SUPABASE_URL);
    if (savedUrl) urlInput.value = savedUrl;
    
    saveBtn.addEventListener("click", async () => {
      let projectUrl = urlInput.value.trim();
      if (!projectUrl) {
        configMsg.innerText = "❌ Please enter your Supabase project URL (e.g., https://abc.supabase.co)";
        configMsg.className = "message-area error-msg";
        return;
      }
      // basic URL format validation
      if (!projectUrl.startsWith("http://") && !projectUrl.startsWith("https://")) {
        projectUrl = "https://" + projectUrl;
      }
      if (!projectUrl.includes(".supabase.co")) {
        configMsg.innerText = "⚠️ URL should end with .supabase.co (example: https://xxxxx.supabase.co)";
        configMsg.className = "message-area error-msg";
        return;
      }
      try {
        // Initialize supabase client with provided URL + anon key
        const { createClient } = supabase;
        const client = createClient(projectUrl, USER_PROVIDED_ANON_KEY);
        // Test connection by checking auth session (lightweight)
        const { data: { session }, error } = await client.auth.getSession();
        if (error && error.message.includes("Invalid API key")) {
          configMsg.innerText = "❌ Invalid API key or URL mismatch. Double-check your Supabase URL and anon key.";
          configMsg.className = "message-area error-msg";
          return;
        }
        // save valid URL
        localStorage.setItem(STORAGE_SUPABASE_URL, projectUrl);
        supabaseClient = client;
        configMsg.innerText = "✅ Connected successfully! Redirecting to login...";
        configMsg.className = "message-area success-msg";
        setTimeout(() => {
          checkAndRenderAuth();
        }, 1000);
      } catch (err) {
        console.error(err);
        configMsg.innerText = "⚠️ Connection error: " + (err.message || "invalid configuration");
        configMsg.className = "message-area error-msg";
      }
    });
  }
  
  // Show login / signup forms (when supabase is ready)
  function renderAuthForms() {
    dynamicContainer.innerHTML = `
      <div id="authTabs">
        <div style="display: flex; gap: 0.8rem; margin-bottom: 1.6rem; border-bottom: 1px solid #eef2fc;">
          <button id="showLoginBtn" class="tab-btn active-tab" style="background:none; border:none; font-weight:600; font-size:1rem; padding:0.5rem 0; cursor:pointer; color:#1e2f5e; border-bottom: 2px solid #1e2f5e;">Sign in</button>
          <button id="showSignupBtn" class="tab-btn" style="background:none; border:none; font-weight:500; font-size:1rem; padding:0.5rem 0; cursor:pointer; color:#5f7392;">Create account</button>
        </div>
        <div id="authPanel">
          <!-- login form default -->
          <div class="input-group">
            <label>📧 Email address</label>
            <input type="email" id="emailInput" placeholder="hello@example.com" autocomplete="email">
          </div>
          <div class="input-group">
            <label>🔒 Password</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn" id="actionBtn">Sign in</button>
          <div class="message-area" id="authMessage"></div>
        </div>
        <div class="small-note">🔐 Demo uses real Supabase Auth — password should be at least 6 characters.</div>
      </div>
    `;
    
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const actionBtn = document.getElementById("actionBtn");
    const authMessageDiv = document.getElementById("authMessage");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const showSignupBtn = document.getElementById("showSignupBtn");
    
    let mode = "login"; // login or signup
    
    function updateUImode() {
      if (mode === "login") {
        actionBtn.innerText = "Sign in";
        if (showLoginBtn) {
          showLoginBtn.style.borderBottom = "2px solid #1e2f5e";
          showLoginBtn.style.color = "#1e2f5e";
          showLoginBtn.style.fontWeight = "600";
          if (showSignupBtn) {
            showSignupBtn.style.borderBottom = "none";
            showSignupBtn.style.color = "#5f7392";
            showSignupBtn.style.fontWeight = "500";
          }
        }
      } else {
        actionBtn.innerText = "Create account";
        if (showSignupBtn) {
          showSignupBtn.style.borderBottom = "2px solid #1e2f5e";
          showSignupBtn.style.color = "#1e2f5e";
          showSignupBtn.style.fontWeight = "600";
          if (showLoginBtn) {
            showLoginBtn.style.borderBottom = "none";
            showLoginBtn.style.color = "#5f7392";
            showLoginBtn.style.fontWeight = "500";
          }
        }
      }
      authMessageDiv.innerText = "";
      authMessageDiv.className = "message-area";
    }
    
    if (showLoginBtn) showLoginBtn.addEventListener("click", () => {
      mode = "login";
      updateUImode();
    });
    if (showSignupBtn) showSignupBtn.addEventListener("click", () => {
      mode = "signup";
      updateUImode();
    });
    
    actionBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        authMessageDiv.innerText = "Please enter both email and password.";
        authMessageDiv.className = "message-area error-msg";
        return;
      }
      if (password.length < 6 && mode === "signup") {
        authMessageDiv.innerText = "Password must be at least 6 characters.";
        authMessageDiv.className = "message-area error-msg";
        return;
      }
      authMessageDiv.innerText = "Processing...";
      authMessageDiv.className = "message-area";
      try {
        if (mode === "login") {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          // success
          authMessageDiv.innerText = "✅ Login successful! Redirecting...";
          authMessageDiv.className = "message-area success-msg";
          setTimeout(() => checkAndRenderAuth(), 800);
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          if (data.user && data.session) {
            authMessageDiv.innerText = "🎉 Account created & signed in! Redirecting...";
            authMessageDiv.className = "message-area success-msg";
            setTimeout(() => checkAndRenderAuth(), 800);
          } else if (data.user && !data.session) {
            authMessageDiv.innerText = "✅ Signup successful! Please check your email to confirm (if email confirmation enabled). You can try login now.";
            authMessageDiv.className = "message-area success-msg";
          } else {
            authMessageDiv.innerText = "Signup completed, but no session. Try logging in.";
          }
        }
      } catch (err) {
        console.error(err);
        let friendlyMsg = err.message;
        if (friendlyMsg.includes("Invalid login credentials")) friendlyMsg = "Invalid email or password.";
        else if (friendlyMsg.includes("Email not confirmed")) friendlyMsg = "Please verify your email before logging in.";
        authMessageDiv.innerText = "❌ " + friendlyMsg;
        authMessageDiv.className = "message-area error-msg";
      }
    });
  }
  
  // Render user dashboard after login
  function renderUserDashboard(user, session) {
    const email = user.email;
    const firstLetter = email ? email.charAt(0).toUpperCase() : "U";
    dynamicContainer.innerHTML = `
      <div class="user-info">
        <div class="avatar-placeholder">${firstLetter}</div>
        <div style="font-weight: 600; font-size: 1.1rem;">${email}</div>
        <div style="font-size: 0.75rem; color:#5670a3; margin-top: 5px;">Signed in via Supabase</div>
        <div style="font-size: 0.7rem; background:#eef3ff; display:inline-block; padding: 4px 12px; border-radius: 40px; margin-top: 10px;">✅ Active session</div>
      </div>
      <button class="btn logout-btn" id="logoutBtn">🚪 Sign out</button>
      <div class="small-note" style="margin-top: 1.2rem;">You are securely authenticated.</div>
    `;
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        // clear local session indicator
        localStorage.removeItem(STORAGE_SESSION_KEY);
        checkAndRenderAuth();
      });
    }
  }
  
  // Core: check current auth session and render appropriate screen
  async function checkAndRenderAuth() {
    if (!supabaseClient) {
      // no client yet, try to load saved URL and initialize
      const savedUrl = localStorage.getItem(STORAGE_SUPABASE_URL);
      if (savedUrl && !supabaseClient) {
        try {
          const { createClient } = supabase;
          const client = createClient(savedUrl, USER_PROVIDED_ANON_KEY);
          // test validity
          await client.auth.getSession();
          supabaseClient = client;
        } catch (e) {
          console.warn("Stored URL invalid, reconfiguring");
          localStorage.removeItem(STORAGE_SUPABASE_URL);
          supabaseClient = null;
        }
      }
      if (!supabaseClient) {
        renderConfigUI();
        return;
      }
    }
    
    // supabaseClient exists, get session
    try {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error) {
        // maybe invalid key/url -> reconfig
        renderConfigUI();
        return;
      }
      if (session && session.user) {
        currentSession = session;
        renderUserDashboard(session.user, session);
      } else {
        // No active session: show login/signup forms
        renderAuthForms();
      }
    } catch (err) {
      console.error("Session fetch error", err);
      renderConfigUI();
    }
  }
  
  // Listen to auth state changes (optional but robust)
  function initAuthListener() {
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
          checkAndRenderAuth();
        } else if (event === 'SIGNED_OUT') {
          checkAndRenderAuth();
        } else if (event === 'USER_UPDATED') {
          checkAndRenderAuth();
        }
      });
    }
  }
  
  // start the application: attempt to initialize from saved URL, otherwise config
  (async function init() {
    const savedUrl = localStorage.getItem(STORAGE_SUPABASE_URL);
    if (savedUrl) {
      try {
        const { createClient } = supabase;
        const testClient = createClient(savedUrl, USER_PROVIDED_ANON_KEY);
        // verify connectivity quickly
        await testClient.auth.getSession();
        supabaseClient = testClient;
        initAuthListener();
        await checkAndRenderAuth();
        return;
      } catch (err) {
        console.warn("Saved connection invalid, resetting config.");
        localStorage.removeItem(STORAGE_SUPABASE_URL);
      }
    }
    // no valid client, show configuration
    renderConfigUI();
  })();
</script>
</body>
</html>
