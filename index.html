<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button id="loginBtn">Login</button>
    <button id="signupBtn">Sign Up</button>

    <p id="message"></p>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://kjlwqaqlcafkvnkvbwzp.supabase.co';
        const supabaseKey = 'sb_publishable_KhfoHF3GW_8Wuycg8N8pEA_08sxglIn';
        const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const message = document.getElementById('message');

        // Sign Up
        document.getElementById('signupBtn').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value
            });
            if (error) {
                message.textContent = 'Error: ' + error.message;
            } else {
                message.textContent = 'Sign-up successful! Check your email to confirm.';
            }
        });

        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            });
            if (error) {
                message.textContent = 'Error: ' + error.message;
            } else {
                message.textContent = 'Logged in successfully!';
                console.log(data.user); // Logged-in user info
            }
        });
    </script>
</body>
</html>
